
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado na raiz do repositorio."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: settings.gradle ou settings.gradle.kts nao encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Corrigir singleLine no Kotlin
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/app/src/main/java/com/aegisnexus/app/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERRO: MainActivity.kt nao encontrado."
            exit 1
          fi

          sed -i 's/^[[:space:]]*singleLine = true[[:space:]]*$/            setSingleLine(true)/' "$FILE"

          if grep -q '^[[:space:]]*singleLine = true[[:space:]]*$' "$FILE"; then
            echo "ERRO: A linha singleLine ainda nao foi corrigida."
            exit 1
          fi

          grep -n 'setSingleLine(true)' "$FILE"

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Nexus-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
